 <title>Eula Library | Sign Up</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="signup-container">

        <h1>📚 Eula Library</h1>
        <h2>Create Your Account</h2>

        <p>Join our fictional world and discover your next favorite story!</p>

        <form action="page1.html" method="get">

            <label for="fullname">Full Name</label>
            <input type="text" id="fullname" name="fullname"
                   placeholder="Enter your full name" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" name="email"
                   placeholder="Enter your email" required>

            <label for="username">Username</label>
            <input type="text" id="username" name="username"
                   placeholder="Create a username" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password"
                   placeholder="Create a password" required minlength="8">

            <label for="confirm-password">Confirm Password</label>
            <input type="password" id="confirm-password"
                   name="confirm-password"
                   placeholder="Enter your password again" required minlength="8">
                


        </form>
         <p class="login-link">
              <a href="page 1.html">Creat account</a>
        </p>

        <p class="login-link">
            Already have an account?
            <a href="login.html">Log In</a>
        </p>

    </div>

</body>
</html>
