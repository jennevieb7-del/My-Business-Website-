<!DOCTYPE html>
<html lang="en">
<head>
    <title>Eula Library | Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">

    <header class="login-header">
        <div class="logo">
            <img src="Vintage Novellas J.E. Emblem (1).png" alt="logo">
        </div>
    </header>

    <main class="login-card">
        <p class="eyebrow">A little world between the pages</p>
        <h1>NOVELLAS</h1>
        <p>Welcome to Eula Library</p>

        <form action="page 1.html">
            <label for="username">Email or mobile number</label>
            <input type="text" id="username" name="username"
                   placeholder="Enter email or mobile number" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password"
                   placeholder="Enter password" required>

            <button type="submit" class="button full-button">Log in</button>

            <p class="sign-up">
                Don't have an account?
                <a href="page9.html">Sign up</a>
            </p>
        </form>
    </main>

</body>
</html>
