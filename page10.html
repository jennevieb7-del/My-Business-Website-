<link rel="stylesheet" href="style.css">
<div class="reading-page">

    <h1>White Lies Beneath the Sand</h1>

    <div class="chapter">
        <h2>Chapter 1</h2>

        <p>
            Welcome to the beginning of the story.
            Enjoy reading your first chapter.
        </p>

        <a href="#unlock-chapter" class="next-button">
            Next Chapter →
        </a>
    </div>

</div>

<div class="coin-popup" id="unlock-chapter">

    <div class="coin-box">

        <a href="#" class="close-button">×</a>

        <h2>🔒 Chapter 2 is Locked</h2>

        <p>You need 10 coins to continue reading.</p>

        <h3>🪙 Choose Your Coin Package</h3>

        <div class="coin-packages">

            <label class="coin-package">
                <input type="radio" name="coins">
                🪙 10 Coins — ₱10
            </label>

            <label class="coin-package">
                <input type="radio" name="coins">
                🪙 50 Coins — ₱50
            </label>

            <label class="coin-package">
                <input type="radio" name="coins">
                🪙 100 Coins — ₱100
            </label>

            <label class="coin-package">
                <input type="radio" name="coins">
                🪙 250 Coins — ₱250
            </label>

        </div>

        <h3>💳 Payment Method</h3>

        <form action="#" method="get">

            <select name="payment" required>
                <option value="">Choose payment method</option>
                <option value="gcash">GCash</option>
                <option value="maya">Maya</option>
                <option value="paypal">PayPal</option>
            </select>

            <button type="submit" class="buy-button">
                Buy Coins
            </button>

        </form>

        <p class="payment-note">
            Select your coin package and preferred payment method.
        </p>

    </div>

</div>
